name: Reusable Workflow To Update Worktree and Trigger Workflow

on:
  workflow_call:
    inputs:
      trigger_page_build:
        description: 'Set to true to trigger the whole hoa-moe page build workflow'
        required: false
        default: false
        type: boolean
    secrets:
      PAT:
        description: 'Personal Access Token'
        required: true

jobs:
  generate_worktree_info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      
      - name: Checkout generate_worktree_info.py script
        uses: actions/checkout@v4
        with:
          repository: HITSZ-OpenAuto/repos-management
          path: .repo_management
          ref: ${{ github.workflow_ref }}
          token: ${{ secrets.PAT }}
          # Use sparse checkout to only get the necessary script
          sparse-checkout: |
            scripts/generate_worktree_info.py
          # Disable cone mode to allow single-file sparse checkouts
          sparse-checkout-cone-mode: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run script to generate worktree info
        run:        
          python3 .repo_management/scripts/generate_worktree_info.py
          echo "Worktree generated and branch created successfully."
          rm -rf .repo_management

      - name: Trigger workflow in hoa-moe
        if: inputs.trigger_page_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/HITSZ-OpenAuto/hoa-moe/actions/workflows/course.yaml/dispatches \
            -d '{"ref":"main"}'